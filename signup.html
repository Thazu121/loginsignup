<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Buddy Signup</title>
    <link rel="stylesheet" href="style/signUp.css">
</head>

<body>
    <header>
        <img id="logo" src="./image/logo.png" alt="Travel Buddy Logo">
    </header>

    <main class="main-content">
        <section id="container">
            <div id="box">
                <h2>Create an Account</h2>
                <p>Join Us Today!</p>

                <form id="signUp" autocomplete="on">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" autocomplete="name" placeholder="Enter your full name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="Enter your email" required>

                    <label for="phoneNumber">Phone Number</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" autocomplete="tel" placeholder="Enter your phone number" required>

                    <label for="location">City</label>
                    <input type="text" id="location" name="location" autocomplete="address-level2" placeholder="Enter your city" required>

                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Create a password" required>
                        <span class="eye-toggle" data-target="password" aria-label="Toggle password visibility">👁️</span>
                    </div>
                    <small id="strength"></small>

                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="Confirm your password" required>
                        <span class="eye-toggle" data-target="confirmPassword" aria-label="Toggle password visibility">👁️</span>
                    </div>
                    <small id="confirm-error"></small>

                    <button type="submit">Sign Up</button>
                    <p id="error"></p>
                </form>

                <div id="lin">
                    Already have an account? <a href="index.html">Sign In</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-logo">
                <img class="logo" src="./image/logo.png" alt="Travel Buddy Logo">
            </div>
            <div class="footer-text">
                © 2025 Travel Buddy. All Rights Reserved.
            </div>
        </div>
    </footer>

    <script src="script/signUp.js"></script>
</body>

</html>
