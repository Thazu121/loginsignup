<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Travel Buddy</title>
    <link rel="stylesheet" href="style/index.css">
</head>

<body>
    <header>
        <img id="logo" src="./image/logo.png" alt="Travel Buddy Logo">
    </header>

    <main id="main-content">
        <section id="container">
            <div id="box">
                <div class="form-header">
                    <h2 id="signInHeading">Sign In</h2>
                    <p>Welcome Back!</p>
                </div>

                <form id="signIn">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter Your Email"
                        autocomplete="username"
                        required
                    >

                    <label for="loginPassword">Password</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            minlength="8"
                            autocomplete="current-password"
                            required
                        >
                        <span class="eye-toggle">👁️</span>
                    </div>

                    <button type="submit" id="signInBtn">Sign In</button>
                    <p id="message" role="alert"></p>
                </form>

                <a href="#" id="forgotPassword" class="forgot">Forgot Password?</a>

                <div id="link">
                    <p>Don't have an account?</p>
                    <a href="signup.html">Sign Up</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-logo">
                <img class="logo" src="./image/logo.png" alt="Travel Buddy Logo">
            </div>
            <div class="footer-text">
                © 2025 Travel Buddy. All Rights Reserved.
            </div>
        </div>
    </footer>

    <script src="script/index.js"></script>
</body>

</html>
